name: "SmartStandard"
description: "Score a repo against the IAIso baseline (README, .smart.json, LICENSE, tests/) and report drift."
branding:
  icon: shield
  color: purple
inputs:
  root:
    description: "Repo root to check"
    required: false
    default: "."
  package:
    description: "Optional pip requirement or path to install instead. Leave empty (the default) to install the copy of SmartStandard this action was taken from, at the ref the workflow names, so nothing is fetched from a package index by name."
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install SmartStandard from this action's own repository
      shell: bash
      env:
        PKG: ${{ inputs.package }}
      run: |
        # Never install by name: "smartstandard" is not published on PyPI by the
        # maintainers yet, so a package of that name is not ours.
        if [ -z "$PKG" ]; then
          PKG="$GITHUB_ACTION_PATH/../.."
          if [ ! -f "$PKG/pyproject.toml" ]; then
            echo "SmartStandard source not found next to the action ($PKG); set the 'package' input" >&2
            exit 1
          fi
        fi
        python -m pip install --quiet "$PKG"
    - shell: bash
      env:
        INPUT_VALUE: ${{ inputs.root }}
      run: python "$GITHUB_ACTION_PATH/../adapter.py" --root "$INPUT_VALUE"
