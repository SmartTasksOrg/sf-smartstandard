[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-smartstandard"
version = "3.0.0"
description = "Standardize before you scale. One shared, auditable convention for AI-assisted work."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "SmartTasks Lab" }]
keywords = ["smart", "ai", "iaiso", "sf-smartstandard", "devtools"]
dependencies = []
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://smarttasks.cloud"
Source = "https://github.com/SmartTasksOrg/sf-smartstandard"
Issues = "https://github.com/SmartTasksOrg/sf-smartstandard/issues"
Security = "https://github.com/SmartTasksOrg/sf-smartstandard/security/policy"
Changelog = "https://github.com/SmartTasksOrg/sf-smartstandard/blob/master/CHANGELOG.md"
Standard = "https://iaiso.org"

[project.scripts]
sf-smartstandard = "sf_smartstandard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
